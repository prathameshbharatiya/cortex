# =============================================================================
# Cortex Secrets — base/secret.yaml
# =============================================================================
# This file is a TEMPLATE. Never commit real values here.
#
# In production, populate this via:
#   - kubectl create secret generic cortex-secrets --from-env-file=.env
#   - Vault injector / External Secrets Operator
#   - Sealed Secrets
#   - CI pipeline (GitHub Actions secrets → kubectl apply)
#
# Generate an API key:
#   cortex-keygen
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cortex-secrets
  namespace: cortex
  labels:
    app.kubernetes.io/name: cortex
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # API keys for robot authentication (generate with: cortex-keygen)
  # Format: key[:robot_id[:perm1+perm2]]  — comma-separated for multiple
  CORTEX_API_KEYS: "REPLACE_WITH_GENERATED_KEY"

  # Redis auth (leave empty if Redis has no password)
  CORTEX_REDIS_PASSWORD: ""

  # Weaviate Cloud API key (only needed if weaviate.enabled=true)
  CORTEX_WEAVIATE_API_KEY: ""

  # TLS certificate paths (if using mTLS — paths inside the pod)
  # CORTEX_TLS_CERT_FILE: "/var/cortex/certs/server.crt"
  # CORTEX_TLS_KEY_FILE:  "/var/cortex/certs/server.key"
  # CORTEX_TLS_CA_FILE:   "/var/cortex/certs/ca.crt"
