site_name: Cortex
site_description: Context Certification Infrastructure for Physical AI
site_url: https://docs.cortex.ai
repo_url: https://github.com/cortex-ai/cortex
repo_name: cortex-ai/cortex
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent:  indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_bases: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Guides:
    - Configuration:  configuration.md
    - Deployment:     deployment.md
    - Migrations:     migrations.md
  - Reference:
    - API Reference:  api/reference.md
    - Error Codes:    error_codes.md
  - Project:
    - Changelog:  changelog.md
    - Security:   security.md
    - License:    license.md

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
