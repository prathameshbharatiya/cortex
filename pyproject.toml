# =============================================================================
# Cortex — pyproject.toml
# =============================================================================
# PEP 517/518/621 compliant. Build with:
#   pip install build
#   python -m build
#
# Install locally (editable, all extras):
#   pip install -e ".[dev,grpc,redis,weaviate,mem0,http,ros2,physicore]"
#
# Install from PyPI (core only):
#   pip install cortex-gate
#
# Install from PyPI (recommended for robot deployments):
#   pip install "cortex-gate[grpc,redis]"
# =============================================================================

[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ── Project metadata (PEP 621) ─────────────────────────────────────────────
[project]
name            = "cortex-gate"
version         = "0.1.0"
description     = "Cortex — Context Certification Infrastructure for Physical AI"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.10"

keywords = [
    "robotics",
    "physical-ai",
    "safety",
    "certification",
    "context",
    "memory",
    "ros2",
    "inference-guard",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Robotics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# ── Authors ────────────────────────────────────────────────────────────────
authors = [
    { name = "Cortex Team" },
]

# ── Core dependencies — installed on every `pip install cortex-gate` ───────
# Keep this minimal. Optional integrations go in [project.optional-dependencies].
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.24",
    "PyNaCl>=1.5.0",
    "msgpack>=1.0",
]

# ── Optional dependency groups ─────────────────────────────────────────────
[project.optional-dependencies]

# mTLS certificate generation (development only)
tls = [
    "cryptography>=42.0",
]

# Prometheus metrics endpoint
metrics = [
    "prometheus-client>=0.20.0",
]

# OpenTelemetry distributed tracing
tracing = [
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
]

# YAML config file support (cortex.yaml)
yaml = [
    "pyyaml>=6.0",
]

# gRPC transport (robot fleet deployments)
grpc = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
]

# Redis memory adapter (L1 cache — strongly recommended for production)
redis = [
    "redis[hiredis]>=5.0.0",
]

# Weaviate memory adapter (L2 vector store — production semantic search)
weaviate = [
    "weaviate-client>=4.4.0",
]

# Mem0 managed memory adapter
mem0 = [
    "mem0ai>=0.0.20",
]

# HTTP REST transport (FastAPI)
http = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

# ROS 2 integration (requires a ROS 2 environment — not installable via pip alone)
# Install ROS 2 Humble/Iron first, then: pip install "cortex-gate[ros2]"
ros2 = [
    # rclpy is distributed with ROS 2 and not on PyPI.
    # This group exists so CI can document the requirement and skip gracefully.
]

# PhysiCore engine (hardware bridge)
physicore = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "requests>=2.31.0",
    "websockets>=12.0",
    "pyyaml>=6.0",
]

# Hardware bridge (serial + MAVLink)
bridge = [
    "pyserial>=3.5",
    "pymavlink>=2.4.37",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
]

# Development — linting, testing, type-checking, docs
dev = [
    # Testing
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.2",
    # Type checking
    "mypy>=1.9",
    "types-redis>=4.6",
    "types-requests>=2.31",
    # Linting & formatting
    "ruff>=0.4.0",
    # Build & release
    "build>=1.2",
    "twine>=5.0",
    # Docs
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

# Full install — everything except ROS 2 (not pip-installable)
all = [
    "cortex-gate[grpc,redis,weaviate,mem0,http,physicore,bridge,metrics,tracing,yaml]",
]

# ── Console scripts ────────────────────────────────────────────────────────
[project.scripts]
# Start the gRPC certification server
cortex-serve      = "cortex.integration.grpc.server:main"
# Start the HTTP REST server
cortex-serve-http = "cortex.integration.http_server:main"
# Run the demo
cortex-demo       = "cortex.cli.demo:main"
# Health check CLI
cortex-health     = "cortex.cli.health:main"
# Generate a new API key
cortex-keygen     = "cortex.security.api_keys:main"
# Generate development TLS/mTLS certificates
cortex-gen-certs  = "cortex.security.mtls:main_gen_certs"
# Run schema migrations
cortex-migrate    = "cortex.migrations:main"
# Unified CLI (keygen / validate-ctx / status / simulate / serve)
cortex            = "cortex.cli.main:main"
# Validate a .ctx wire-format file
cortex-validate   = "cortex.protocol.validator:main"
# Run the simulation harness
cortex-simulate   = "cortex.cli.main:cmd_simulate"
# Status check
cortex-status     = "cortex.cli.main:cmd_status"

# ── URLs ───────────────────────────────────────────────────────────────────
[project.urls]
Homepage      = "https://github.com/cortex-ai/cortex"
Documentation = "https://docs.cortex.ai"
Repository    = "https://github.com/cortex-ai/cortex"
"Bug Tracker" = "https://github.com/cortex-ai/cortex/issues"
Changelog     = "https://github.com/cortex-ai/cortex/blob/main/CHANGELOG.md"

# ── Setuptools configuration ───────────────────────────────────────────────
[tool.setuptools]
zip-safe    = false
include-package-data = true

[tool.setuptools.packages.find]
where   = ["."]
include = ["cortex*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
"cortex" = ["py.typed"]
"cortex.integration.grpc" = ["*.proto"]
"cortex.physicore_engine"  = ["*.yaml", "*.json"]

# ── pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "--import-mode=importlib",
]
markers = [
    "unit: pure unit tests, no I/O",
    "integration: tests that require external services (Redis, Weaviate)",
    "slow: tests that take more than 2 seconds",
    "ros2: tests that require a ROS 2 environment",
]
asyncio_mode = "auto"

# ── Coverage ───────────────────────────────────────────────────────────────
[tool.coverage.run]
source   = ["cortex"]
omit     = [
    "cortex/integration/grpc/cortex_pb2*.py",  # generated protobuf
    "cortex/cli/*",                             # thin CLI wrappers
    "cortex/physicore_engine/api/*",            # hardware API server
    "cortex/physicore_engine/sdk/*",            # hardware SDK client
    "cortex/physicore_engine/sentinel_*.py",    # hardware signal processing
    "cortex/physicore_engine/core/engine.py",   # PhysiCore MPC engine (hardware)
    "cortex/physicore_engine/sentinel/core.py", # SentinelOS (requires hardware attachment)
    "cortex/physicore_engine/__init__.py",
    "cortex/integration/grpc/server.py",        # requires running gRPC server
    "cortex/integration/http_server.py",        # requires running HTTP server
    "cortex/integration/health/monitor.py",     # health monitor (integration tested)
    "cortex/integration/health/__init__.py",
    "cortex/integration/protocol.py",           # protocol DTOs (integration tested)
    "cortex/integration/ros2_node.py",          # requires ROS2 runtime
    "cortex/integration/sdk.py",                # SDK (tested via test_integration.py)
    "cortex/integration/server.py",             # server runtime (integration tested)
    "cortex/config/factory.py",                 # factory (tested via integration)
]

[tool.coverage.report]
show_missing   = true
skip_covered   = false
fail_under     = 73   # hardware engine paths (sentinel_path, physicore_engine) excluded
exclude_lines  = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

# ── Ruff (linter + formatter) ──────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length    = 100
src            = ["."]
exclude        = [
    "cortex/integration/grpc/cortex_pb2*.py",
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ANN", # flake8-annotations (type hints)
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "ANN101",  # self type annotation
    "ANN102",  # cls type annotation
    "ANN401",  # Any is sometimes intentional
    "E501",    # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["cortex"]

# ── Mypy ──────────────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.10"
strict                 = true
ignore_missing_imports = true
exclude                = [
    "cortex/integration/grpc/cortex_pb2.*\\.py",
    "tests/",
]

[[tool.mypy.overrides]]
module = ["redis.*", "weaviate.*", "mem0.*", "grpc.*", "rclpy.*"]
ignore_missing_imports = true
