---
# ServiceAccount — Cortex pods run with this identity
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cortex
  namespace: cortex
  labels:
    app.kubernetes.io/name: cortex
automountServiceAccountToken: false   # don't auto-mount unless needed

---
# Role — minimal permissions needed by Cortex pods
# Cortex pods currently need no K8s API access.
# This Role is a placeholder for future needs (e.g. reading Secrets via CSI).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cortex
  namespace: cortex
  labels:
    app.kubernetes.io/name: cortex
rules: []   # no permissions required

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cortex
  namespace: cortex
  labels:
    app.kubernetes.io/name: cortex
subjects:
  - kind: ServiceAccount
    name: cortex
    namespace: cortex
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: cortex
